// RustMode build.gradle
//
// Standalone build. Finds the installed Processing on its own (see below).
//
// Usage (run from RustMode/):
//   gradle jar                       # build RustMode.jar
//   PROCESSING_DIR=/usr/lib/processing gradle jar   # if it cannot find it
//
// Or from the processing4 root if you have the full checkout:
//   ./gradlew :RustMode:jar
//
// Output: RustMode/mode/RustMode.jar  (fat jar, includes tree-sitter binding)

plugins {
    id 'java'
}

group   = 'processing.mode.rust'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// ── Locate Processing ────────────────────────────────────────────────────────
//
// Same search as LuaMode: PROCESSING_DIR (or -Pprocessing=...), then the
// usual install folders, then the folder of the `processing` launcher on PATH.
// Jars are matched by pattern so 4.3 and 4.5.x layouts both work:
//   4.5.x: lib/app/*.jar, lib/app/resources/core/library/core*.jar
//   4.3:   lib/pde.jar,   core/library/core.jar
// -Pcore=... and -Papp=... still add specific jars on top.

repositories {}

def hasJars = { File d ->
    new File(d, 'lib/pde.jar').isFile() || new File(d, 'core/library/core.jar').isFile() ||
        (new File(d, 'lib/app').listFiles()?.any { it.name.endsWith('.jar') } ?: false)
}
def findProcessing = {
    def given = System.getenv('PROCESSING_DIR') ?: project.findProperty('processing')
    if (given) return file(given)
    def home = System.getProperty('user.home')
    def tries = ['/usr/lib/processing', '/usr/share/processing', '/opt/processing', '/opt/processing4',
                 "$home/processing-4", "$home/processing", "$home/processing4", "$home/.local/share/processing",
                 '/usr/local/lib/processing'].collect { new File(it) }
    System.getenv('PATH')?.split(File.pathSeparator)?.each { dir ->
        def launcher = new File(dir, 'processing')
        if (launcher.exists()) {
            def d = launcher.canonicalFile.parentFile
            for (int i = 0; i < 3 && d != null; i++) { tries << d; d = d.parentFile }
        }
    }
    ['/opt', home].each { root ->
        new File(root).listFiles()?.findAll { it.isDirectory() && it.name.toLowerCase().startsWith('processing') }?.each { tries << it }
    }
    tries.find { it.isDirectory() && hasJars(it) }
}
def processingDir = findProcessing()
def extraJars = []
if (project.hasProperty('core')) extraJars << file(project.property('core'))
else if (System.getenv('PROCESSING4_CORE')) extraJars << file(System.getenv('PROCESSING4_CORE'))
if (project.hasProperty('app')) extraJars << file(project.property('app'))

if (processingDir == null && extraJars.isEmpty()) {
    throw new GradleException("Processing not found. Run with PROCESSING_DIR=/path/to/processing " +
        "(the folder that has lib/ in it), or -Pcore=... -Papp=...")
}
def processingJars = processingDir == null ? files() : fileTree(processingDir) {
    include 'lib/app/*.jar', 'lib/app/resources/core/library/core*.jar'
    include 'lib/pde.jar', 'core/library/core.jar'
}
println "Processing: ${processingDir ?: 'not searched'}${extraJars ? ' + ' + extraJars.join(', ') : ''}"

repositories {
    mavenCentral()
}

dependencies {
    // Processing 4 core + app — provided by the installed IDE at runtime; not bundled.
    compileOnly processingJars
    compileOnly files(extraJars)

    // java-tree-sitter binding, from Maven Central (its native library is in lib/<platform>/)
    implementation 'ch.usi.si.seart:java-tree-sitter:1.9.1'
}

sourceSets {
    main {
        java {
            srcDirs = ["${projectDir}/src/java"]
        }
    }
}

// ── Jar task ──────────────────────────────────────────────────────────────────

jar {
    archiveFileName    = 'RustMode.jar'
    destinationDirectory = file("${projectDir}/mode")

    // Bundle the native tree-sitter-rust grammar for each platform so
    // RustMode.loadNativeTreeSitter() can extract it at startup.
    from("${projectDir}/lib/linux-x86-64")   { into 'lib/linux-x86-64'   }
    from("${projectDir}/lib/macos-arm64")     { into 'lib/macos-arm64'    }
    from("${projectDir}/lib/macos-x86-64")    { into 'lib/macos-x86-64'   }
    from("${projectDir}/lib/windows-x86-64")  { into 'lib/windows-x86-64' }

    manifest {
        attributes 'Implementation-Title':   'RustMode',
                   'Implementation-Version': archiveVersion
    }

    // Fat jar: bundle tree-sitter binding classes so the IDE does not need it
    // on its own classpath.
    from({
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }) {
        // the maven jar ships musl natives that won't load on glibc;
        // ours come from native/build.sh under lib/<platform>/
        exclude '*.so', '*.dylib', '*.dll'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ── Convenience tasks ─────────────────────────────────────────────────────────

tasks.register('install') {
    dependsOn jar
    group = 'RustMode'
    description = 'Build the jar and verify it landed in mode/.'
    doLast {
        def dest = file("${projectDir}/mode/RustMode.jar")
        if (!dest.exists()) {
            throw new GradleException("mode/RustMode.jar not found after build")
        }
        def kb = dest.length() / 1024
        println "ok  mode/RustMode.jar  (${kb} KB)"
        println ""
        println "Restart Processing to load the updated mode."
    }
}
