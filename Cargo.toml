[package]
name = "processing"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Processing-style API for RustMode sketches"

[dependencies]
# Low-overhead RwLock / Mutex for the global sketch state cells.
parking_lot = "0.12"
# Software pixel-buffer windowing for native sketches (not used under --features wasm)
minifb = "0.27"
# PNG decoding for loadImage()
png = "0.17"
# JPEG decoding for loadImage()
zune-jpeg = "0.4"
# TrueType / OpenType text for createFont() and textFont()
fontdue = "0.9"
# Sound output and decoding for loadSound() and the oscillators
rodio = { version = "0.20", default-features = false, features = ["wav", "vorbis", "flac", "symphonia-mp3"] }

[features]
default = []
wasm    = []

[profile.dev]
opt-level = 1   # slightly faster dev builds; incremental still on

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
