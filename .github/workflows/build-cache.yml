name: build-cache

# Precompiles the engine (and every crate it uses) for each platform and
# renderer, into cache/<platform>/<renderer>/. With it, RustMode builds a
# sketch with one rustc call instead of compiling everything first.
# scripts/create-release.py --ci runs it and downloads the results into
# cache/ before zipping a release.

# Pushing a v* tag also makes the GitHub release: RustMode.zip and
# RustMode-lite.zip, with every platform's caches (release job, below).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Only the newest run matters; a newer one cancels it (but never a release).
concurrency:
  group: build-cache-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  cache:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     platform: linux-x86-64 }
          - { os: ubuntu-22.04-arm, platform: linux-arm64 }
          - { os: macos-15-intel, platform: macos-x86-64 }
          - { os: macos-latest,   platform: macos-arm64 }
          - { os: windows-latest, platform: windows-x86-64 }
    env:
      # one folder for everything this job compiles: the CPU build reuses
      # what the libprocessing build already made, and the folder is kept
      # between runs (below) so only what changed compiles next time
      RUSTMODE_CACHE_WORK: ${{ github.workspace }}/../rustmode-cache
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5

      - name: Rust (the version in rust-toolchain.toml)
        shell: bash
        run: |
          v=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          # Windows: the windows-gnu toolchain, the one Rust Mode builds sketches
          # with there (it brings its own linker, so users need no Visual Studio)
          if [ "$RUNNER_OS" = Windows ]; then v="$v-x86_64-pc-windows-gnu"; fi
          rustup toolchain install "$v" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$v" >> "$GITHUB_ENV"

      - name: Linux libraries and GLFW 3.4
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libx11-dev libxkbcommon-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxinerama-dev libwayland-dev wayland-protocols libasound2-dev libudev-dev pkg-config cmake
          curl -fsSL https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.zip -o glfw.zip
          unzip -q glfw.zip
          cmake -S glfw-3.4 -B glfw-build -DBUILD_SHARED_LIBS=ON -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF
          sudo cmake --build glfw-build --target install
          sudo ldconfig

      - name: GLFW (macOS)
        if: runner.os == 'macOS'
        run: brew install glfw

      # Downloaded crates, and everything compiled last time. The key changes
      # with the lock file and the engine's code; when it doesn't match, the
      # newest older one is used, so only the difference compiles.
      - name: Restore compiled crates
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/../rustmode-cache/${{ matrix.platform }}/target
          key: build-${{ matrix.platform }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('src/**/*.rs', 'build.rs', 'Cargo.toml') }}
          restore-keys: |
            build-${{ matrix.platform }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
            build-${{ matrix.platform }}-${{ env.RUSTUP_TOOLCHAIN }}-

      # libprocessing first: it compiles everything the CPU build needs too
      - name: Build the libprocessing cache
        id: lp
        shell: bash
        # GLFW on Windows isn't sorted out yet; don't let it stop the CPU cache
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/build-cache.py libprocessing

      - name: Build the CPU cache
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/build-cache.py cpu

      # Each cache builds a sketch the way RustMode does and runs it, so a
      # cache that doesn't work on its platform never ships
      - name: Smoke test (CPU)
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y -q xvfb
            xvfb-run -a "$PY" scripts/ci/smoke.py cpu
          else
            "$PY" scripts/ci/smoke.py cpu
          fi

      - name: Smoke test (libprocessing)
        if: steps.lp.outcome == 'success'
        shell: bash
        continue-on-error: true   # GPU drivers on CI machines vary; the result is in the log
        run: |
          PY=$(command -v python3 || command -v python)
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y -q xvfb mesa-vulkan-drivers
            xvfb-run -a "$PY" scripts/ci/smoke.py libprocessing
          else
            "$PY" scripts/ci/smoke.py libprocessing
          fi

      # Saved even when a build failed, so the next run starts from what got done
      - name: Save compiled crates
        if: always() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/../rustmode-cache/${{ matrix.platform }}/target
          key: build-${{ matrix.platform }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('src/**/*.rs', 'build.rs', 'Cargo.toml') }}

      - uses: actions/upload-artifact@v6
        with:
          name: cache-${{ matrix.platform }}-cpu
          path: cache/${{ matrix.platform }}/cpu
          if-no-files-found: error
          compression-level: 1

      - uses: actions/upload-artifact@v6
        if: steps.lp.outcome == 'success'
        with:
          name: cache-${{ matrix.platform }}-libprocessing
          path: cache/${{ matrix.platform }}/libprocessing
          if-no-files-found: error
          compression-level: 1

  # ── GitHub release (v* tags) ───────────────────────────────────────────────
  release:
    name: Release
    needs: cache
    # a platform whose cache failed just builds with cargo the first time
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Rust (for the cache version check)
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal

      - name: Processing (pde and core jars)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/processing.tgz" \
            https://github.com/processing/processing4/releases/download/processing-1293-4.3/processing-4.3-linux-x64.tgz
          mkdir "$RUNNER_TEMP/processing"
          tar xzf "$RUNNER_TEMP/processing.tgz" -C "$RUNNER_TEMP/processing" --strip-components=1 \
            --wildcards '*/lib/pde.jar' '*/core/library/core.jar'
          echo "PROCESSING_DIR=$RUNNER_TEMP/processing" >> "$GITHUB_ENV"

      - name: Download the caches
        uses: actions/download-artifact@v6
        with:
          pattern: cache-*
          path: artifacts/

      - name: Put them in cache/
        run: |
          for d in artifacts/cache-*; do
            n=${d#artifacts/cache-}; rend=${n##*-}; plat=${n%-*}
            mkdir -p "cache/$plat"; rm -rf "cache/$plat/$rend"; mv "$d" "cache/$plat/$rend"
            echo "cache/$plat/$rend"
          done
          rm -rf artifacts

      - name: Zips
        run: python3 scripts/create-release.py

      # notes from release-notes/<tag>.md when there is one; a re-pushed tag
      # replaces the zips on the release that's already there
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zips="../RustMode.zip ../RustMode-lite.zip RustMode.txt"
          notes="release-notes/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $zips --clobber
            [ -f "$notes" ] && gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          elif [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" $zips --title "Rust Mode ${GITHUB_REF_NAME#v}" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" $zips --title "Rust Mode ${GITHUB_REF_NAME#v}" --generate-notes
          fi
